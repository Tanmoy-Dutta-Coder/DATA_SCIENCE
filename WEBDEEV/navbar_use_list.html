<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            text-decoration: none;
            background-color: black;
            color: white;
        }
        .nav ul li{
            list-style: none;
        }
        /* .nav:hover{
            background-color: whitesmoke;
            box-shadow: 0 0 10px 0 black;
        } */
         a:hover{
            color: aliceblue;
            font-family: fantasy;
            font-size: 30px;

         }
        ul{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1vw;
        }
        li>a{
            background: none;
        }
        header{
            padding-top: 1vh;
            border:2px solid white;  
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 1vw;
            
        }
        header:hover{
            background-color: white;

            color: black;
            
        }
        /* header:hover>div{
            
        } */
        #item{
            height: 3em;
            width: 6em;
            border: 1px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        #item>p{
            background: none;
        }
        #item>p:hover{
            font-family: fantasy;
            /* font-size: 2em; */
            color: black;

        }
    </style>
</head>
<body>
    <header>
        <div class="navl">
            <h1>Anythhing</h1>
        </div>
        <div class="nav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact Us</a></li>
                <li><a href="#">Order</a></li>
            </ul>
        </div>
        <div class="search">
            <div id="item"><p>⬇️Try Now</p></div>
        </div>
    </header>
</body>
</html>
