<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 70vh;
            width: 100%;
            border: 2px solid black;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(2,1fr);
            gap: 20px;
        }
        .a{
            background: red;

        }
        .b{
            background: #000;
        }
        .c{
            background: gray;
        }
        .d{
            background: blue;
        }
        .e{
            background: yellow;
        }
        .f{
            background: pink;
        }
        .g{
            background: green;
        }
        .h{
            background: purple;
        }
        /* li{
            display: flex;
            justify-content: space-between;
        } */
    </style>

</head>

<body>
    <div class="box">
        <!-- <h3>SOCIAL PLUGIN</h3> -->
        <div class="social a"></div>
        <div class="social b"></div>
        <div class="social c"></div>
        <div class="social d"></div>
        <div class="social e"></div>
        <div class="social f"></div>
        <div class="social g"></div>
        <div class="social h"></div>
    </div>
    <ul>
        <li><div class="social"></div>
        <div class="social"></div></li>
        <li><div class="social"></div>
        <div class="social"></div></li>
        <li><div class="social"></div>
        <div class="social"></div></li>
    </ul>
</body>

</html>
